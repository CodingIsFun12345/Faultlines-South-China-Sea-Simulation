<!-- Git Connection Test -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Faultlines SCS — Login</title>
  <style>
    /* System font fallbacks so the game works fully offline / file:// */
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Nunito:wght@400;600;700&display=swap');
  </style>
  <style>
    :root {
      --bg: #060f1e;
      --bg2: #0a1628;
      --teal: #00b4d8;
      --teal2: #0077b6;
      --gold: #f4a261;
      --gold2: #e76f51;
      --green: #2ec4b6;
      --red: #e63946;
      --text: #daeeff;
      --text2: #6fa8c8;
      --bdr: rgba(0, 180, 216, .15);
      --bdr2: rgba(0, 180, 216, .35);
      --card: rgba(10, 22, 40, .92);
      --fh: "Rajdhani", sans-serif;
      --fm: "Share Tech Mono", monospace;
      --fb: "Nunito", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      height: 100%
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--fb);
      background-image: radial-gradient(ellipse at 20% 10%, rgba(0, 100, 180, .12) 0%, transparent 50%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 43px, rgba(0, 180, 216, .02) 43px, rgba(0, 180, 216, .02) 44px), repeating-linear-gradient(90deg, transparent, transparent 43px, rgba(0, 180, 216, .02) 43px, rgba(0, 180, 216, .02) 44px);
    }

    .screen {
      display: none;
      position: relative;
      z-index: 1
    }

    .screen.active {
      display: block
    }

    #loading {
      position: fixed;
      inset: 0;
      background: rgba(6, 15, 30, .94);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px
    }

    .spin {
      width: 32px;
      height: 32px;
      border: 2.5px solid var(--bdr);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin .6s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    #loading p {
      font-family: var(--fm);
      font-size: 12px;
      color: var(--text2);
      letter-spacing: 1px
    }

    #screen-login {
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 40%, rgba(0, 100, 200, .18) 0%, transparent 65%)
    }

    #screen-login.active {
      display: flex
    }

    .login-wrap {
      width: 100%;
      max-width: 420px
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px
    }

    .login-title {
      font-family: var(--fh);
      font-size: 52px;
      font-weight: 700;
      letter-spacing: 8px;
      color: var(--teal);
      text-transform: uppercase;
      line-height: 1;
      text-shadow: 0 0 40px rgba(0, 180, 216, .3)
    }

    .login-sub {
      font-family: var(--fm);
      font-size: 11px;
      color: var(--text2);
      letter-spacing: 4px;
      margin-top: 8px;
      text-transform: uppercase
    }

    /* glassy card background with safari compatibility */
    .login-card {
      background: rgba(10, 22, 40, .96);
      border: 1px solid var(--bdr2);
      border-radius: 14px;
      padding: 32px 28px;
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px)
    }

    .login-card .fg {
      margin-bottom: 16px
    }

    .login-card label {
      display: block;
      font-family: var(--fm);
      font-size: 10px;
      color: var(--text2);
      margin-bottom: 5px;
      letter-spacing: 1.5px;
      text-transform: uppercase
    }

    .login-card input,
    .login-card select {
      width: 100%;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--bdr2);
      border-radius: 7px;
      color: var(--text);
      font-family: var(--fb);
      font-size: 15px;
      padding: 11px 14px;
      transition: border-color .2s
    }

    .login-card input:focus,
    .login-card select:focus {
      outline: none;
      border-color: var(--teal);
      background: rgba(0, 180, 216, .06)
    }

    .login-card select option {
      background: #0a1628
    }

    .pw-wrap {
      position: relative
    }

    .pw-wrap input {
      padding-right: 44px
    }

    .pw-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text2);
      font-size: 16px;
      padding: 4px;
      line-height: 1;
      transition: color .18s
    }

    .pw-toggle:hover {
      color: var(--teal)
    }

    .key-hint {
      background: rgba(0, 180, 216, .06);
      border: 1px solid var(--bdr);
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 11px;
      color: var(--text2);
      font-family: var(--fm);
      line-height: 1.55;
      margin-top: 6px
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--teal2), var(--teal));
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: var(--fh);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity .18s, transform .1s;
      margin-top: 6px
    }

    .btn-login:hover {
      opacity: .9
    }

    .btn-login:active {
      transform: scale(.99)
    }

    .login-err {
      background: rgba(230, 57, 70, .1);
      border: 1px solid rgba(230, 57, 70, .3);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--red);
      margin-top: 12px
    }

    /* Sticky header with glassy blur */
    .hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 52px;
      border-bottom: 1px solid var(--bdr);
      background: rgba(6, 15, 30, .98);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 200
    }

    .hdr-brand {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .hdr-brand h1 {
      font-family: var(--fh);
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--teal);
      text-transform: uppercase
    }

    .season-chip {
      font-family: var(--fm);
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: .5px;
      white-space: nowrap;
      background: rgba(0, 180, 216, .1);
      border: 1px solid var(--bdr2);
      color: var(--teal)
    }

    .season-chip.fall {
      background: rgba(244, 162, 97, .1);
      border-color: rgba(244, 162, 97, .3);
      color: var(--gold)
    }

    .season-chip.winter {
      background: rgba(142, 202, 230, .1);
      border-color: rgba(142, 202, 230, .25);
      color: #8ecae6
    }

    .season-chip.spring {
      background: rgba(46, 196, 182, .1);
      border-color: rgba(46, 196, 182, .28);
      color: var(--green)
    }

    .season-chip.summer {
      background: rgba(230, 57, 70, .1);
      border-color: rgba(230, 57, 70, .28);
      color: var(--red)
    }

    .season-chip.setup {
      background: rgba(142, 202, 230, .08);
      border-color: rgba(142, 202, 230, .2);
      color: #8ecae6
    }

    .hdr-right {
      display: flex;
      align-items: center;
      gap: 14px
    }

    .hdr-meta {
      font-family: var(--fm);
      font-size: 11px;
      color: var(--text2);
      line-height: 1.7
    }

    .hdr-meta b {
      color: var(--gold)
    }

    .hdr-actions {
      display: flex;
      gap: 6px
    }

    .app-layout {
      display: grid;
      grid-template-columns: 270px 1fr;
      min-height: calc(100vh - 52px)
    }

    @media(max-width:680px) {
      .app-layout {
        grid-template-columns: 1fr
      }
    }

    .sidebar {
      border-right: 1px solid var(--bdr);
      background: rgba(6, 15, 30, .7);
      padding: 16px 13px;
      overflow-y: auto;
      max-height: calc(100vh - 52px)
    }

    .main {
      padding: 20px 22px;
      overflow-y: auto;
      max-height: calc(100vh - 52px)
    }

    .btn {
      font-family: var(--fh);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all .18s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap
    }

    .btn-p {
      background: var(--teal2);
      color: #fff
    }

    .btn-p:hover {
      background: var(--teal)
    }

    .btn-g {
      background: var(--gold);
      color: #060f1e
    }

    .btn-g:hover {
      background: var(--gold2)
    }

    .btn-d {
      background: var(--red);
      color: #fff
    }

    .btn-d:hover {
      background: #b71c27
    }

    .btn-o {
      background: transparent;
      border: 1px solid var(--bdr2);
      color: var(--text2)
    }

    .btn-o:hover {
      border-color: var(--teal);
      color: var(--teal)
    }

    .btn-sm {
      font-size: 10px;
      padding: 5px 10px
    }

    .btn-full {
      width: 100%;
      justify-content: center
    }

    .btn:disabled {
      opacity: .35;
      cursor: not-allowed
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bdr);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 14px
    }

    .card-sm {
      padding: 12px 14px;
      margin-bottom: 10px
    }

    .card-title {
      font-family: var(--fh);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--bdr);
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .fg {
      margin-bottom: 12px
    }

    label {
      display: block;
      font-family: var(--fm);
      font-size: 10px;
      color: var(--text2);
      margin-bottom: 4px;
      letter-spacing: 1px;
      text-transform: uppercase
    }

    input,
    select {
      width: 100%;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--bdr2);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--fb);
      font-size: 14px;
      padding: 9px 12px;
      transition: border-color .18s
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--teal);
      background: rgba(0, 180, 216, .05)
    }

    select option {
      background: #0a1628
    }

    .badge {
      display: inline-block;
      font-family: var(--fm);
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: .6px;
      white-space: nowrap
    }

    .bt {
      background: rgba(0, 180, 216, .15);
      color: var(--teal);
      border: 1px solid rgba(0, 180, 216, .28)
    }

    .bgo {
      background: rgba(244, 162, 97, .15);
      color: var(--gold);
      border: 1px solid rgba(244, 162, 97, .28)
    }

    .br {
      background: rgba(230, 57, 70, .15);
      color: var(--red);
      border: 1px solid rgba(230, 57, 70, .28)
    }

    .bgr {
      background: rgba(46, 196, 182, .15);
      color: var(--green);
      border: 1px solid rgba(46, 196, 182, .28)
    }

    .bgy {
      background: rgba(100, 160, 200, .12);
      color: #8ecae6;
      border: 1px solid rgba(100, 160, 200, .2)
    }

    .bam {
      background: rgba(255, 209, 102, .12);
      color: #ffd166;
      border: 1px solid rgba(255, 209, 102, .22)
    }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px
    }

    .stat-box {
      background: rgba(0, 180, 216, .06);
      border: 1px solid var(--bdr);
      border-radius: 8px;
      padding: 10px 12px;
      text-align: center
    }

    .stat-v {
      font-family: var(--fm);
      font-size: 22px;
      color: var(--teal);
      line-height: 1
    }

    .stat-gold {
      color: var(--gold);
    }

    .stat-l {
      font-size: 9px;
      color: var(--text2);
      margin-top: 2px;
      letter-spacing: 1px;
      text-transform: uppercase
    }

    /* Utility classes to avoid inline styles */
    .mt8 {
      margin-top: 8px;
    }

    .mt14 {
      margin-top: 14px;
    }

    .mb10 {
      margin-bottom: 10px;
    }

    .m0 {
      margin: 0;
    }

    .fs10 {
      font-size: 10px;
    }

    .fs11 {
      font-size: 11px;
    }

    .fs12 {
      font-size: 12px;
    }

    .fs13 {
      font-size: 13px;
    }

    .text-right {
      text-align: right;
    }

    .text-center {
      text-align: center;
    }

    .display-block {
      display: block;
    }

    .no-decor {
      text-decoration: none;
    }

    .border-top-bdr {
      border-top: 1px solid var(--bdr);
      padding-top: 12px;
    }

    .gap8 {
      gap: 8px;
    }

    .w130 {
      width: 130px;
    }

    .w90 {
      width: 90px;
    }

    .w160 {
      width: 160px;
    }

    .w170 {
      width: 170px;
    }

    .max-h180 {
      max-height: 180px;
      overflow-y: auto;
    }

    .flex1 {
      flex: 1;
    }

    .p12 {
      padding: 12px;
    }

    .p1-5 {
      padding: 1px 5px;
    }

    .bg-row {
      background: rgba(230, 57, 70, .05);
    }

    .gap3 {
      gap: 3px;
    }

    .min-w120 {
      min-width: 120px;
    }

    .min-w28 {
      min-width: 28px;
    }

    .fs9 {
      font-size: 9px;
    }

    .fs8 {
      font-size: 8px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--bdr);
      margin-bottom: 18px;
      overflow-x: auto
    }

    .tab {
      font-family: var(--fh);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 8px 16px;
      background: none;
      border: none;
      color: var(--text2);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all .18s;
      margin-bottom: -1px;
      white-space: nowrap
    }

    .tab.on {
      color: var(--teal);
      border-bottom-color: var(--teal)
    }

    .tab:hover:not(.on) {
      color: var(--text)
    }

    .tp {
      display: none
    }

    .tp.on {
      display: block
    }

    .al {
      padding: 10px 14px;
      border-radius: 7px;
      margin-bottom: 10px;
      font-size: 13px;
      line-height: 1.55
    }

    .ai {
      background: rgba(0, 180, 216, .07);
      border: 1px solid var(--bdr2);
      color: var(--teal)
    }

    .aw {
      background: rgba(244, 162, 97, .08);
      border: 1px solid rgba(244, 162, 97, .26);
      color: var(--gold)
    }

    .ae {
      background: rgba(230, 57, 70, .08);
      border: 1px solid rgba(230, 57, 70, .26);
      color: var(--red)
    }

    .as {
      background: rgba(46, 196, 182, .08);
      border: 1px solid rgba(46, 196, 182, .26);
      color: var(--green)
    }

    .rn {
      background: rgba(0, 180, 216, .04);
      border-left: 3px solid var(--teal2);
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
      font-size: 12px;
      color: var(--text2);
      margin-bottom: 10px;
      line-height: 1.55
    }

    .fleet-item {
      background: rgba(255, 255, 255, .022);
      border: 1px solid var(--bdr);
      border-radius: 7px;
      padding: 10px 12px;
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap
    }

    .fleet-nm {
      font-family: var(--fh);
      font-size: 13px;
      font-weight: 600;
      flex: 1;
      min-width: 120px
    }

    .fleet-det {
      font-family: var(--fm);
      font-size: 10px;
      color: var(--text2)
    }

    .hpb {
      width: 56px;
      height: 4px;
      background: rgba(255, 255, 255, .09);
      border-radius: 2px;
      overflow: hidden
    }

    .hpf {
      height: 100%;
      border-radius: 2px
    }

    .hpf.hi {
      background: var(--green)
    }

    .hpf.mi {
      background: var(--gold)
    }

    .hpf.lo {
      background: var(--red)
    }

    .shop-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border: 1px solid var(--bdr);
      border-radius: 8px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, .016)
    }

    .shop-row.cant {
      opacity: .36
    }

    .shop-ico {
      font-size: 22px;
      width: 36px;
      text-align: center;
      flex-shrink: 0
    }

    .shop-info {
      flex: 1
    }

    .shop-nm {
      font-family: var(--fh);
      font-size: 14px;
      font-weight: 600
    }

    .shop-st {
      font-family: var(--fm);
      font-size: 10px;
      color: var(--text2);
      margin-top: 2px
    }

    .shop-cost {
      font-family: var(--fm);
      font-size: 15px;
      color: var(--gold);
      font-weight: bold
    }

    /* ── Spy Cards ── */
    .spy-card {
      background: rgba(157, 78, 221, .08);
      border: 1px solid rgba(157, 78, 221, .3);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .spy-card.used {
      opacity: .45;
      border-style: dashed;
    }

    .spy-card.locked {
      opacity: .55;
      border-color: rgba(255, 255, 255, .1);
      background: rgba(255, 255, 255, .02);
    }

    .spy-card-name {
      font-family: var(--fh);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #c77dff;
      text-transform: uppercase;
    }

    .spy-card.locked .spy-card-name {
      color: var(--text2);
    }

    .spy-card-desc {
      font-family: var(--fm);
      font-size: 10px;
      color: var(--text2);
      margin-top: 3px;
      line-height: 1.5;
    }

    .spy-badge {
      background: rgba(157, 78, 221, .18);
      border: 1px solid rgba(157, 78, 221, .32);
      color: #c77dff;
      font-family: var(--fm);
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 3px;
      letter-spacing: .5px;
      text-transform: uppercase;
      display: inline-block;
    }

    .spy-badge.used {
      background: rgba(255, 255, 255, .05);
      border-color: rgba(255, 255, 255, .1);
      color: var(--text2);
    }

    .spy-badge.locked {
      background: rgba(255, 255, 255, .04);
      border-color: rgba(255, 255, 255, .08);
      color: var(--text2);
    }

    .spy-shop-row {
      border: 1px solid rgba(157, 78, 221, .25);
      border-radius: 9px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(157, 78, 221, .04);
      cursor: pointer;
      transition: border-color .18s, background .18s;
    }

    .spy-shop-row:hover {
      border-color: rgba(157, 78, 221, .55);
      background: rgba(157, 78, 221, .1);
    }

    .spy-shop-row.selected {
      border-color: #c77dff;
      background: rgba(157, 78, 221, .14);
    }

    .spy-shop-row.locked-card {
      opacity: .5;
      cursor: default;
      pointer-events: none;
    }

    .scs-icon {
      font-size: 20px;
      width: 32px;
      text-align: center;
      flex-shrink: 0;
    }

    .scs-info {
      flex: 1;
    }

    .scs-name {
      font-family: var(--fh);
      font-size: 13px;
      font-weight: 600;
      color: #c77dff;
    }

    .scs-desc {
      font-family: var(--fm);
      font-size: 10px;
      color: var(--text2);
      margin-top: 2px;
    }

    .scs-cost {
      font-family: var(--fm);
      font-size: 13px;
      color: var(--gold);
      font-weight: bold;
      flex-shrink: 0;
    }

    .event-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border: 1px solid var(--bdr);
      border-radius: 7px;
      margin-bottom: 6px;
    }

    /* ── Fish Zone Widget ── */
    .fz-card {
      border: 1px solid var(--bdr);
      border-radius: 10px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .fz-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      background: rgba(255, 255, 255, .03);
    }

    .fz-card-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .fz-card-name {
      font-family: var(--fh);
      font-size: 14px;
      font-weight: 600;
      flex: 1;
    }

    .fz-card-health {
      font-family: var(--fm);
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 3px;
      border: 1px solid transparent;
    }

    .fz-card-body {
      padding: 10px 14px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .fz-stat {
      text-align: center;
    }

    .fz-stat-v {
      font-family: var(--fh);
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
    }

    .fz-stat-l {
      font-family: var(--fm);
      font-size: 9px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-top: 2px;
    }

    .fz-bar-wrap {
      padding: 0 14px 12px;
    }

    .fz-bar-bg {
      background: rgba(255, 255, 255, .07);
      border-radius: 3px;
      height: 6px;
      overflow: hidden;
    }

    .fz-bar-fill {

      border-radius: 3px;

    }

    .fz-bar-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 3px;
      font-family: var(--fm);
      font-size: 9px;
      color: var(--text2);
    }

    .fz-boats {
      padding: 0 14px 10px;
      font-family: var(--fm);
      font-size: 10px;
      color: var(--text2);
      line-height: 1.6;
    }

    .fz-proj {
      padding: 0 14px 12px;

      align-items: center;
      flex-wrap: wrap;

    .fz-proj-box {
      background: rgba(255, 255, 255, .05);

    }

    .fz-proj-l {

      font-size: 9px;
      color: var(--text2);
    }

    /* Simulator */
    .fz-sim {
      padding: 10px 14px 14px;
      border-top: 1px solid var(--bdr);
      margin-top: 2px;
    }

    .fz-sim-title {
      font-family: var(--fh);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .5px;
      color: var(--text2);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .fz-sim-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .fz-sim-label {
      font-family: var(--fm);
      font-size: 10px;
      color: var(--text2);
      white-space: nowrap;
    }

    .fz-sim-input {
      background: rgba(255, 255, 255, .06);
      border: 1px solid var(--bdr);
      border-radius: 5px;
      color: var(--text);
      font-family: var(--fm);
      font-size: 12px;
      padding: 4px 8px;
      width: 64px;
      text-align: center;
    }

    .fz-sim-input:focus {
      outline: none;
      border-color: var(--teal);
    }

    .fz-sim-chart {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 64px;
      padding: 0 0 4px;
    }

    .fz-sim-bar-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex: 1;
    }

    .fz-sim-bar {
      width: 100%;
      border-radius: 3px 3px 0 0;
      min-height: 3px;
      transition: height .25s, background .25s;
    }

    .fz-sim-bar-lbl {
      font-family: var(--fm);
      font-size: 8px;
      color: var(--text2);
      white-space: nowrap;
    }

    .fz-sim-warn {
      font-family: var(--fm);
      font-size: 10px;
      color: #e63946;
      margin-top: 6px;
      line-height: 1.5;
    }

    .ni {
      display: flex;
      align-items: center;
      gap: 4px
    }

    .ni button {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid var(--bdr2);
      background: rgba(255, 255, 255, .04);
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .ni button:hover:not(:disabled) {
      border-color: var(--teal);
      color: var(--teal)
    }

    .ni button:disabled {
      opacity: .2;
      cursor: default
    }

    .ni input {
      width: 38px;
      text-align: center;
      padding: 4px;
      font-size: 12px
    }

    .fz-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border: 1px solid var(--bdr);
      border-radius: 6px;
      margin-bottom: 6px
    }

    .fz-row.on {
      border-color: var(--teal2);
      background: rgba(0, 100, 180, .07)
    }

    .fz-row.off {
      opacity: .32;
      pointer-events: none
    }

    .fz-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0
    }

    .fz-nm {
      flex: 1;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--fh)
    }

    .fz-ct {
      font-family: var(--fm);
      font-size: 10px;
      color: var(--text2);
      white-space: nowrap
    }

    .order-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--bdr);
      border-radius: 7px;
      margin-bottom: 6px;
      background: rgba(255, 255, 255, .016)
    }

    .order-c {
      font-family: var(--fh);
      font-size: 12px;
      font-weight: 600;
      width: 95px;
      flex-shrink: 0;
      padding-top: 1px
    }

    .tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px
    }

    .tbl th {
      font-family: var(--fm);
      font-size: 9px;
      color: var(--text2);
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 10px;
      border-bottom: 1px solid var(--bdr);
      text-align: left
    }

    .tbl td {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(0, 180, 216, .06);
      vertical-align: middle
    }

    .tbl tr:last-child td {
      border-bottom: none
    }

    .tbl tr:hover td {
      background: rgba(0, 180, 216, .04)
    }

    .g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    @media(max-width:580px) {
      .g2 {
        grid-template-columns: 1fr
      }
    }

    .dv {
      border: none;
      border-top: 1px solid var(--bdr);
      margin: 14px 0
    }

    .tm {
      font-family: var(--fm)
    }

    .mu {
      color: var(--text2)
    }

    .tgo {
      color: var(--gold)
    }

    .tte {
      color: var(--teal)
    }

    .tgr {
      color: var(--green)
    }

    .tr {
      color: var(--red)
    }

    .mt8 {
      margin-top: 8px
    }

    .mt14 {
      margin-top: 14px
    }

    .fl {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap
    }

    .fb {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px
    }

    .hidden {
      display: none !important
    }

    .w100 {
      width: 100%
    }

    .stl {
      font-family: var(--fh);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 7px
    }

    .nd {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: var(--red);
      border-radius: 50%;
      margin-left: 5px;
      vertical-align: middle;
      animation: pulse 1.5s ease-in-out infinite
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .2
      }
    }

    #moverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .8);
      z-index: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px
    }

    .mbox {
      width: 100%;
      max-width: 460px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--bdr2);
      border-radius: 12px;
      padding: 22px 20px
    }

    .setup-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
      margin: 12px 0
    }

    .setup-card {
      border: 1px solid var(--bdr);
      border-radius: 8px;
      padding: 12px;
      text-align: center
    }

    .setup-card.done {
      border-color: var(--green);
      background: rgba(46, 196, 182, .05)
    }

    .setup-card .flag {
      font-size: 24px;
      display: block;
      margin-bottom: 4px
    }

    .setup-card .cname {
      font-family: var(--fh);
      font-size: 13px;
      font-weight: 600
    }

    .setup-card .cst {
      font-family: var(--fm);
      font-size: 10px;
      margin-top: 3px
    }

    .conflict-banner {
      background: rgba(230, 57, 70, .08);
      border: 1px solid rgba(230, 57, 70, .3);
      border-radius: 9px;
      padding: 14px 16px;
      margin-bottom: 14px
    }
  </style>
</head>
<body>
  <div id="loading" class="hidden">
    <div class="spin"></div>
    <p id="lmsg">Loading…</p>
  </div>
  <div id="screen-login" class="screen active">
    <div class="login-wrap">
      <div class="login-logo">
        <div class="login-title">SCS</div>
        <div class="login-sub">South China Sea Simulation</div>
      </div>
      <div class="login-card">
        <div class="fg"><label>Role</label>
          <select id="lr" title="Select Login Role">
            <option value="">— Select role —</option>
            <option value="gm">Game Master</option>
            <option value="player">Player</option>
          </select>
        </div>
        <div id="lcw" class="fg hidden"><label>Country</label>
          <select id="lc" title="Select Player Country">
            <option value="">— Select country —</option>
            <option>China</option>
            <option>Taiwan</option>
            <option>Philippines</option>
            <option>Malaysia</option>
            <option>Indonesia</option>
            <option>Thailand</option>
            <option>Cambodia</option>
            <option>Vietnam</option>
          </select>
        </div>
        <div class="fg"><label>PIN</label>
          <div class="pw-wrap">
            <input type="password" id="lp" placeholder="Enter PIN" autocomplete="current-password"
              onkeydown="if(event.key==='Enter')doLogin()">
            <button class="pw-toggle" onclick="togglePw('lp',this)" type="button">👁</button>
          </div>
        </div>
        <div id="gkw" class="hidden">
          <div class="fg">
            <label>GM Service Key</label>
            <div class="pw-wrap">
              <input type="password" id="gk" placeholder="Paste service_role key">
              <button class="pw-toggle" onclick="togglePw('gk',this)" type="button">👁</button>
            </div>
            <div class="key-hint">Memory only — never stored, cleared on logout.</div>
          </div>
        </div>
        <button class="btn-login" onclick="doLogin()">Enter Simulation</button>
        <div id="lerr" class="login-err hidden"></div>
      </div>
    </div>
  </div>
  <script src="functions.js"></script>
  <script>

    // ─── LOGIN ──────────────────────────────────────────────────────
    document.getElementById('lr').addEventListener('change', function () {
      document.getElementById('lcw').classList.toggle('hidden', this.value !== 'player');
      document.getElementById('gkw').classList.toggle('hidden', this.value !== 'gm');
    });

    /**
     * Authenticates the user (Player or GM) using a PIN stored in Supabase.
     * Adapted for the multi-page split: on success this used to call
     * initApp() to render the game in-page. Now it saves the session
     * (see saveSession() in functions.js) and navigates to the
     * appropriate page — player.html or gm.html — which loads its own
     * data on arrival. Everything above the success path (field
     * validation, the verify_pin RPC call, error handling) is untouched.
     */
    async function doLogin() {
      const role = document.getElementById('lr').value;
      const pin = document.getElementById('lp').value;
      const country = document.getElementById('lc').value;
      const gmKey = document.getElementById('gk').value.trim();
      const errEl = document.getElementById('lerr');
      errEl.classList.add('hidden');
      if (!role) { errEl.textContent = 'Select a role.'; errEl.classList.remove('hidden'); return; }
      if (role === 'player' && !country) { errEl.textContent = 'Select your country.'; errEl.classList.remove('hidden'); return; }
      if (!pin) { errEl.textContent = 'Enter your PIN.'; errEl.classList.remove('hidden'); return; }
      if (role === 'gm' && !gmKey) { errEl.textContent = 'Paste the GM service key.'; errEl.classList.remove('hidden'); return; }
      showLoad('Verifying…');
      try {
        const loginCountry = role === 'gm' ? 'gm' : country;
        const res = await rpc('verify_pin', { p_country: loginCountry, p_pin: pin });
        if (!res?.ok) { hideLoad(); errEl.textContent = res?.error || 'Login failed.'; errEl.classList.remove('hidden'); return; }
        if (role === 'gm') SB_SVC = gmKey;
        SESSION_PIN = pin; CU = { role, country: role === 'gm' ? 'gm' : country };
        saveSession();
        window.location.href = role === 'gm' ? 'gm.html' : 'player.html';
      } catch (e) { hideLoad(); errEl.textContent = 'Connection error: ' + e.message; errEl.classList.remove('hidden'); }
    }

    // If a session already exists (e.g. the user navigated back here while
    // still logged in), skip the form and go straight to their page.
    document.addEventListener('DOMContentLoaded', () => {
      if (loadSession()) {
        window.location.href = CU.role === 'gm' ? 'gm.html' : 'player.html';
      }
    });
  </script>
</body>

</html>
